name: Ossuary art contract

on:
  pull_request:
    paths:
      - .github/workflows/ossuary-art.yml
      - source/art/**
      - game/assets/art/**
      - game/data/05_nursery.json
      - source/music/**
      - tools/**
      - tests/**

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -B tests/test_ossuary_buttress.py
          python -B tests/test_art.py
          python -B tests/test_actor_body_art_ledger.py
          python -B tests/test_actor_raw_metadata_privacy.py
          python -B tests/test_worker_regions.py
          python -B tests/test_weapon_raster_ledger.py
          python -B tests/test_rivet_forward_art_ledger.py
          python -B tests/test_threshold_art_ledger.py
          python -B tests/test_title_theme.py
