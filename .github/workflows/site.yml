name: Alpha download page

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CHECKPOINT.md'
      - 'LICENSE'
      - 'game/licenses/NULL-CHOIR.txt'
      - 'tests/test_splash.py'
      - '.github/workflows/site.yml'

permissions:
  contents: read

jobs:
  splash:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 -B tests/test_splash.py
